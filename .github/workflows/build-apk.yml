name: Build OpenWrt APK Theme (HG680P)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "OpenWrt Target"
        required: true
        default: "armsr"
      subtarget:
        description: "OpenWrt Subtarget"
        required: true
        default: "armv8"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip wget curl git python3 file rsync \
            zstd xz-utils libncurses-dev zlib1g-dev libssl-dev perl

      - name: Download and extract OpenWrt SDK
        run: |
          set -e
          TARGET="${{ github.event.inputs.target || 'armsr' }}"
          SUBTARGET="${{ github.event.inputs.subtarget || 'armv8' }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          SDK_TAR=$(curl -fsSL --retry 3 "${BASE_URL}/" | grep -oE 'openwrt-sdk-[^"<>]+\.tar\.(xz|zst)' | head -n 1)
          test -n "${SDK_TAR}"
          wget -q --tries=3 "${BASE_URL}/${SDK_TAR}" -O sdk.archive
          mkdir -p openwrt-sdk
          tar -xf sdk.archive -C openwrt-sdk --strip-components=1

      - name: Sanitize and prepare package in SDK
        run: |
          set -e
          PKG_DIR="openwrt-sdk/package/luci-theme-kiheo-brutalism"
          mkdir -p "${PKG_DIR}/files"

          MAKEFILE_PATH=$(find . -maxdepth 3 -not -path './.git*' -not -path './openwrt-sdk*' -iname 'makefile*' -type f | head -n 1)
          test -n "${MAKEFILE_PATH}"
          cp "${MAKEFILE_PATH}" "${PKG_DIR}/Makefile"

          WWW_PATH=$(find . -maxdepth 4 -not -path './.git*' -not -path './openwrt-sdk*' -type d -name 'www' | head -n 1)
          USR_PATH=$(find . -maxdepth 4 -not -path './.git*' -not -path './openwrt-sdk*' -type d -name 'usr' | head -n 1)
          test -n "${WWW_PATH}"
          test -n "${USR_PATH}"

          cp -r "${WWW_PATH}" "${PKG_DIR}/files/"
          cp -r "${USR_PATH}" "${PKG_DIR}/files/"

          sed -i 's/\r$//' "${PKG_DIR}/Makefile"
          perl -i -pe 's/^( {4})+/"\t" x (length($&) \/ 4)/e' "${PKG_DIR}/Makefile"

          find "${PKG_DIR}/files" -type f \( -name "*.ut" -o -name "*.js" -o -name "*.css" -o -name "*.svg" \) -exec sed -i 's/\r$//' {} +
          find "${PKG_DIR}/files" -type d -exec chmod 755 {} +
          find "${PKG_DIR}/files" -type f -exec chmod 644 {} +

      - name: Compile APK package
        run: |
          set -e
          cd openwrt-sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-theme-kiheo-brutalism=y" >> .config
          make defconfig
          make -j$(nproc) package/luci-theme-kiheo-brutalism/compile V=s

      - name: Collect and verify APK artifacts
        run: |
          set -e
          mkdir -p dist
          find openwrt-sdk/bin -type f -name "*kiheo-brutalism*.apk" -exec cp -v {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist/)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kiheo-brutalism-hg680p-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: KIHEO Brutalism Theme v1.0.0 (OpenWrt APK)
          files: dist/*.apk
