name: Build OpenWrt APK Theme (HG680P)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "OpenWrt Target"
        required: true
        default: "armsr"
      subtarget:
        description: "OpenWrt Subtarget"
        required: true
        default: "armv8"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk unzip wget curl git python3 file rsync \
            zstd xz-utils libncurses-dev zlib1g-dev libssl-dev perl

      - name: Download and extract OpenWrt SDK
        run: |
          set -e
          TARGET="${{ github.event.inputs.target || 'armsr' }}"
          SUBTARGET="${{ github.event.inputs.subtarget || 'armv8' }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          echo "Mencari SDK di ${BASE_URL}/"
          SDK_TAR=$(curl -fsSL --retry 3 "${BASE_URL}/" | grep -oE 'openwrt-sdk-[^"<>]+\.tar\.(xz|zst)' | head -n 1)
          echo "SDK ditemukan: ${SDK_TAR}"
          test -n "${SDK_TAR}"
          wget -q --tries=3 "${BASE_URL}/${SDK_TAR}" -O sdk.archive
          mkdir -p openwrt-sdk
          tar -xf sdk.archive -C openwrt-sdk --strip-components=1

      - name: Sanitize and prepare package in SDK
        run: |
          set -e
          test -f luci-theme-kiheo-brutalism/Makefile
          test -d luci-theme-kiheo-brutalism/files

          # Bersihkan line ending Windows (CRLF) dan ubah indentasi 4 spasi di Makefile menjadi TAB
          sed -i 's/\r$//' luci-theme-kiheo-brutalism/Makefile
          perl -i -pe 's/^( {4})+/"\t" x (length($&) \/ 4)/e' luci-theme-kiheo-brutalism/Makefile

          # Bersihkan CRLF pada file web/template dan atur permission standar Linux
          find luci-theme-kiheo-brutalism/files -type f \( -name "*.ut" -o -name "*.js" -o -name "*.css" -o -name "*.svg" \) -exec sed -i 's/\r$//' {} +
          find luci-theme-kiheo-brutalism/files -type d -exec chmod 755 {} +
          find luci-theme-kiheo-brutalism/files -type f -exec chmod 644 {} +

          cp -r luci-theme-kiheo-brutalism openwrt-sdk/package/

      - name: Compile APK package
        run: |
          set -e
          cd openwrt-sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-theme-kiheo-brutalism=y" >> .config
          make defconfig
          make -j$(nproc) package/luci-theme-kiheo-brutalism/compile V=s

      - name: Collect and verify APK artifacts
        run: |
          set -e
          mkdir -p dist
          find openwrt-sdk/bin -type f -name "*kiheo-brutalism*.apk" -exec cp -v {} dist/ \;
          ls -lh dist/
          file dist/*.apk
          test -n "$(ls -A dist/)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kiheo-brutalism-hg680p-apk
          path: dist/*.apk
