name: Build OpenWrt APK Theme (HG680P)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "OpenWrt Target"
        required: true
        default: "armsr"
      subtarget:
        description: "OpenWrt Subtarget"
        required: true
        default: "armv8"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install minimal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd xz-utils file libncurses-dev

      - name: Download and extract OpenWrt SDK
        run: |
          set -e
          TARGET="${{ github.event.inputs.target || 'armsr' }}"
          SUBTARGET="${{ github.event.inputs.subtarget || 'armv8' }}"
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          SDK_TAR=$(curl -fsSL "${BASE_URL}/" | grep -oE 'openwrt-sdk-[^"<>]+\.tar\.(xz|zst)' | head -n 1)
          echo "Selected SDK: ${SDK_TAR}"
          test -n "${SDK_TAR}"
          wget -q "${BASE_URL}/${SDK_TAR}" -O sdk.archive
          mkdir -p openwrt-sdk
          tar -xf sdk.archive -C openwrt-sdk --strip-components=1

      - name: Prepare package in SDK
        run: |
          set -e
          cp -r luci-theme-kiheo-brutalism openwrt-sdk/package/

      - name: Compile APK package
        run: |
          set -e
          cd openwrt-sdk
          make defconfig
          echo "CONFIG_PACKAGE_luci-theme-kiheo-brutalism=y" >> .config
          make defconfig
          make package/luci-theme-kiheo-brutalism/compile V=s

      - name: Collect APK artifacts
        run: |
          set -e
          mkdir -p dist
          find openwrt-sdk/bin -type f -name "*kiheo-brutalism*.apk" -exec cp -v {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist/)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-kiheo-brutalism-hg680p-apk
          path: dist/*.apk
